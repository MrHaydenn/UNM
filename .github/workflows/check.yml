name: Validate UNM
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y caddy bind9 bind9-utils
      - run: python -m unittest discover -s tests -v
      - run: bash -n deploy/install.sh deploy/update.sh deploy/setup-services.sh
      - run: systemd-analyze verify deploy/unm-caddy.service deploy/unm-dns.service
      - run: node --check web/app.js
