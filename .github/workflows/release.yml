name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/check.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version and package source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version=re.search(r'^VERSION = "([^"]+)"',Path('unm.py').read_text(),re.M)[1]
          assert os.environ['RELEASE_TAG']=='v'+version, 'Tag does not match app version'
          PY
          git archive --format=tar --prefix="UNM-${RELEASE_TAG}/" HEAD | gzip -n > "UNM-${RELEASE_TAG}.tar.gz"
          sha256sum "UNM-${RELEASE_TAG}.tar.gz" > SHA256SUMS.txt
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "UNM-${RELEASE_TAG}.tar.gz" SHA256SUMS.txt --verify-tag --title "UNM ${RELEASE_TAG}" --notes-file RELEASE-NOTES.md --latest
